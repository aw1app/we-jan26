server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Passenger Service Route (Matches both /passengers and /passengers/{id})
spring.cloud.gateway.routes[0].id=passenger-service
spring.cloud.gateway.routes[0].uri=lb://passenger-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/passengers, /passengers/**


# Booking Service Route (Matches both /bookings and /bookings/{id})
spring.cloud.gateway.routes[1].id=booking-service
spring.cloud.gateway.routes[1].uri=lb://booking-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/bookings, /bookings/**


spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
