<!-- ngSwitch Demo -->
<h2>Angular ngSwitch Demo</h2>

<div [ngSwitch]="status">

    <p *ngSwitchCase="'pending'">
        ⏳ Order is pending
    </p>

    <p *ngSwitchCase="'approved'">
        ✅ Order approved
    </p>

    <p *ngSwitchCase="'rejected'">
        ❌ Order rejected
    </p>

    <p *ngSwitchDefault>
        Unknown status
    </p>

</div>
